<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0e"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/styles/apps/catalog.css"><script src="/assets/scripts/apps/apps-enhance.js" defer></script><title>Apps · Homebase</title><style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f4f5f6;font-family:Manrope,system-ui,sans-serif}.shell{width:min(1160px,100%);margin:auto;padding:24px clamp(18px,5vw,60px) 80px}.back{display:inline-flex;min-height:50px;align-items:center;padding:0 17px;border:1px solid #30363d;border-radius:14px;color:#fff;text-decoration:none}h1{font-size:clamp(42px,7vw,76px);letter-spacing:-.07em;margin:58px 0 10px}p{color:#9da5ad;line-height:1.65}.section{margin:42px 0 15px;font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#d8dde1}.count{color:#9da5ad;font-weight:400;text-transform:none;letter-spacing:0;margin-left:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{position:relative;display:block;min-height:178px;border:1px solid #30363d;border-radius:18px;background:#151a20;color:#fff;padding:20px;text-align:left}.card b{display:block;font-size:16px;margin-bottom:7px}.card span{display:block;color:#9da5ad;font-size:12px;line-height:1.45}.card:focus,.card:hover,.pad-focus{outline:3px solid #fff!important;outline-offset:3px}.app-icon{width:54px;height:54px;object-fit:contain;margin-bottom:18px;filter:drop-shadow(0 8px 12px #0008)}.search{display:flex;gap:10px;margin:24px 0 14px}.search input{flex:1;min-height:56px;border:1px solid #30363d;border-radius:15px;background:#11151a;color:#fff;padding:0 18px;font:inherit}.search button,.chip{min-height:48px;border:1px solid #30363d;border-radius:14px;background:#151a20;color:#fff;padding:0 18px;font:inherit}.chips{display:flex;gap:8px;overflow:auto;padding:2px 2px 16px}.chip{white-space:nowrap;border-radius:99px}.catalog .card{padding-bottom:66px}.install{position:absolute;left:18px;bottom:16px;min-height:36px;border:0;border-radius:9px;background:#eef0f2;color:#111;padding:0 14px;font:inherit}.meta{font-size:10px!important;margin-top:9px}.verified{color:#dce9ff!important}.empty{padding:24px;border:1px dashed #30363d;border-radius:15px;color:#9da5ad}.notice{position:fixed;z-index:20;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 15px;border-radius:99px;background:#eef0f2;color:#111;font-size:11px;opacity:0;transition:.2s}.notice.show{opacity:1}@media(pointer:coarse){.card{min-height:195px}.back,.search button,.chip{min-height:56px}}
</style></head><body><main class="shell"><a class="back" href="/index.html">← Homebase</a><h1>Your Linux apps.</h1><p>Open what is installed, or browse thousands of ARM-compatible Flathub apps without leaving Homebase.</p><h2 class="section">Installed here <span id="installed-count" class="count"></span></h2><section id="installed" class="grid"><div class="empty">Reading installed apps…</div></section><h2 class="section">Explore Flathub</h2><form id="catalog-search" class="search"><input id="query" placeholder="Search games, music, creative tools…"><button>Search</button></form><div class="chips"><button class="chip" data-query="games">Games</button><button class="chip" data-query="music">Music</button><button class="chip" data-query="video">Video</button><button class="chip" data-query="graphics">Creative</button><button class="chip" data-query="development">Development</button><button class="chip" data-query="utility">Utilities</button><button class="chip" data-query="education">Education</button></div><section id="catalog" class="grid catalog"><div class="empty">Loading ARM apps…</div></section></main><div id="notice" class="notice"></div><script>
const notice=m=>{const n=document.querySelector('#notice');n.textContent=m;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2400)};async function openApp(id,name){notice('Opening '+name+'…');const r=await fetch('/api/app/'+encodeURIComponent(id),{method:'POST'});if(!r.ok)notice('Could not open '+name)}fetch('/api/apps').then(r=>r.json()).then(apps=>{document.querySelector('#installed-count').textContent=apps.length+' apps';const grid=document.querySelector('#installed');grid.innerHTML='';apps.forEach(app=>{const b=document.createElement('button');b.className='card';b.innerHTML='<img class="app-icon" alt=""><b></b><span class="summary"></span><span class="meta"></span>';b.querySelector('img').src=app.icon;b.querySelector('img').onerror=e=>e.currentTarget.style.visibility='hidden';b.querySelector('b').textContent=app.name;b.querySelector('.summary').textContent=app.summary||'Linux application';b.querySelector('.meta').textContent=(app.source||'Installed locally')+' · tap for details';b.onclick=()=>openApp(app.id,app.name);grid.appendChild(b)})});
const catalog=document.querySelector('#catalog');async function browse(query='popular'){catalog.innerHTML='<div class="empty">Searching Flathub…</div>';try{const r=await fetch('/api/catalog?q='+encodeURIComponent(query)),apps=await r.json();catalog.innerHTML='';apps.forEach(app=>{const card=document.createElement('article');card.className='card';card.dataset.appId=app.app_id;card.innerHTML='<img class="app-icon" alt=""><b></b><span class="summary"></span><span class="meta"></span><button class="install">Install</button>';card.querySelector('img').src=app.icon;card.querySelector('b').textContent=app.name;card.querySelector('.summary').textContent=app.summary||'Linux application';const meta=card.querySelector('.meta');meta.textContent=(app.verification_verified?'✓ Verified · ':'')+(app.developer_name||app.app_id);if(app.verification_verified)meta.classList.add('verified');card.querySelector('.install').onclick=async()=>{if(!confirm('Install '+app.name+' from Flathub?'))return;notice('Installing '+app.name+' in the background…');const response=await fetch('/api/install/'+encodeURIComponent(app.app_id),{method:'POST'});if(!response.ok)notice('Could not start installation')};catalog.appendChild(card)});if(!apps.length)catalog.innerHTML='<div class="empty">No ARM-compatible results found.</div>'}catch{catalog.innerHTML='<div class="empty">Flathub is unavailable right now.</div>'}}document.querySelector('#catalog-search').onsubmit=e=>{e.preventDefault();browse(document.querySelector('#query').value||'popular')};document.querySelectorAll('.chip').forEach(button=>button.onclick=()=>browse(button.dataset.query));browse();
let i=0,latch=false;function pads(){const p=[...(navigator.getGamepads?.()||[])].filter(Boolean)[0],items=[...document.querySelectorAll('.back,.card,.search button,.chip,.install')].filter(x=>x.offsetParent);if(p){const d=p.buttons[12]?.pressed||p.buttons[14]?.pressed||p.axes[1]<-.6||p.axes[0]<-.6?-1:p.buttons[13]?.pressed||p.buttons[15]?.pressed||p.axes[1]>.6||p.axes[0]>.6?1:0,a=p.buttons[0]?.pressed,b=p.buttons[1]?.pressed;if((d||a||b)&&!latch){i=(i+d+items.length)%items.length;items.forEach(x=>x.classList.remove('pad-focus'));items[i]?.classList.add('pad-focus');items[i]?.scrollIntoView({block:'center',behavior:'smooth'});if(a)items[i]?.click();if(b)location.href='/'}latch=d||a||b}requestAnimationFrame(pads)}pads();
</script><link rel="stylesheet" href="/assets/styles/apps/apps-install-modal.css"><script src="/assets/scripts/apps/install-jobs.js"></script><script src="/assets/scripts/apps/apps-install-modal.js"></script></body></html>
