<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Utility Desk · Homebase</title><script src="/assets/scripts/shared/theme-sync.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#10151a;color:#eef5f7;font:14px Manrope,system-ui}.shell{width:min(980px,100%);margin:auto;padding:22px clamp(16px,5vw,56px) 80px}.back,button,input,textarea{font:inherit}.back,button{min-height:46px;border:1px solid #ffffff35;border-radius:12px;background:#ffffff10;color:inherit;padding:0 15px;cursor:pointer}.back{display:inline-flex;align-items:center;text-decoration:none}h1{font-size:clamp(42px,7vw,72px);margin:42px 0 6px;letter-spacing:-.07em}p{color:#aab9bf;line-height:1.55}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:30px}.card{padding:20px;border:1px solid #ffffff22;border-radius:18px;background:#182127}.card h2{margin:0 0 8px;font-size:16px}.card small{display:block;color:#9fb3bc;margin-bottom:12px}textarea,input{width:100%;border:1px solid #ffffff25;border-radius:10px;background:#0c1115;color:#fff;padding:12px}textarea{min-height:250px;resize:vertical}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.row button.primary{background:#bde6ef;color:#102025;border-color:#bde6ef}.answer{min-height:60px;margin-top:10px;padding:14px;border:1px solid #ffffff20;border-radius:10px;background:#0c1115;font:700 19px ui-monospace,monospace}.status{color:#9ee2c0;min-height:20px;margin:9px 0 0;font-size:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}}html[data-theme="ultra-retro"] body{background:#aaa;color:#000;font-family:"MS Sans Serif",Tahoma,sans-serif}html[data-theme="ultra-retro"] .card{border:2px solid #000;border-radius:0;background:#d4d4d4;box-shadow:inset 2px 2px #fff,inset -2px -2px #666,4px 4px #111}html[data-theme="ultra-retro"] h1,html[data-theme="ultra-retro"] p,html[data-theme="ultra-retro"] small{color:#000}html[data-theme="ultra-retro"] button,html[data-theme="ultra-retro"] input,html[data-theme="ultra-retro"] textarea,html[data-theme="ultra-retro"] .answer{border:2px solid #111;border-radius:0;background:#eee;color:#000;box-shadow:inset 1px 1px #fff,inset -1px -1px #777}html[data-theme="ultra-retro"] .primary{background:#000080!important;color:#fff!important}</style></head><body><main class="shell"><button class="back" onclick="parent!==window?parent.closePocket():history.back()">← Homebase</button><h1>Utility Desk.</h1><p>Small local tools that do not need an account, a cloud, or another tab.</p><section class="grid"><article class="card"><h2>Scratch notes</h2><small>Saved only in this browser on this device.</small><textarea id="notes" placeholder="Write a quick note, checklist, command, or idea…"></textarea><div class="row"><button class="primary" id="save">Save note</button><button id="copy">Copy</button><button id="clear">Clear</button></div><p class="status" id="note-status"></p></article><aside class="card"><h2>Quick calculator</h2><small>Basic arithmetic; no data leaves Homebase.</small><input id="math" inputmode="decimal" placeholder="Example: (42 * 3) / 7"><div class="answer" id="answer">—</div><div class="row"><button class="primary" id="calculate">Calculate</button></div><h2 style="margin-top:30px">Clipboard handoff</h2><small>Paste something from another app, then copy it back when you need it.</small><textarea id="clip" style="min-height:115px" placeholder="Temporary text…"></textarea><div class="row"><button id="clip-copy">Copy text</button></div><p class="status" id="clip-status"></p></aside></section></main><script>const $=s=>document.querySelector(s),key='homebase-utility-notes';$('#notes').value=localStorage.getItem(key)||'';$('#save').onclick=()=>{localStorage.setItem(key,$('#notes').value);$('#note-status').textContent='Saved locally.'};$('#copy').onclick=async()=>{await navigator.clipboard.writeText($('#notes').value);$('#note-status').textContent='Copied.'};$('#clear').onclick=()=>{if(confirm('Clear this local note?')){$('#notes').value='';localStorage.removeItem(key);$('#note-status').textContent='Cleared.'}};$('#calculate').onclick=()=>{const text=$('#math').value.trim();if(!/^[0-9+*/().%\s-]+$/.test(text)){$('#answer').textContent='Use numbers and + − × ÷ only.';return}try{$('#answer').textContent=String(Function('return ('+text+')')())}catch{$('#answer').textContent='Check that expression.'}};$('#clip-copy').onclick=async()=>{await navigator.clipboard.writeText($('#clip').value);$('#clip-status').textContent='Copied to clipboard.'}</script></body></html>
