<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import a game · Homebase</title><script src="/assets/scripts/shared/theme-sync.js"></script><style>
:root{color-scheme:dark;--bg:#101417;--line:#3a444a;--text:#f5f7f8;--muted:#9ca7ae;--accent:#78d7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#15749a38,transparent 36%),var(--bg);color:var(--text);font:14px Manrope,system-ui}.shell{width:min(980px,100%);margin:auto;padding:24px clamp(16px,5vw,56px) 80px}.back,button{min-height:48px;border:1px solid var(--line);border-radius:13px;background:#ffffff0b;color:#fff;padding:0 16px;font-weight:700}h1{font-size:clamp(46px,8vw,78px);letter-spacing:-.075em;line-height:.92;margin:42px 0 12px}p{color:var(--muted);line-height:1.65}.private{display:inline-flex;padding:8px 11px;border:1px solid #42be6555;border-radius:99px;color:#9cedaa}.importer{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}.card{padding:22px;border:1px solid var(--line);border-radius:20px;background:#ffffff08}.wide{grid-column:1/-1}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:7px;color:#cbd2d6;font-size:11px}input,select,textarea{width:100%;min-height:50px;border:1px solid var(--line);border-radius:11px;background:#0d1114;color:#fff;padding:12px;font:inherit}textarea{min-height:100px}.files{display:grid;gap:10px}.files label{padding:14px;border:1px dashed var(--line);border-radius:13px}.files input{min-height:auto;border:0;padding:6px 0;background:none}.submit{width:100%;min-height:64px;background:#f4f6f7;color:#111;font-size:16px}.status{min-height:22px;color:var(--accent)}aside{margin-top:16px;padding:14px;border-left:3px solid var(--accent);background:#ffffff06}@media(max-width:700px){.importer,.fields{grid-template-columns:1fr}.wide{grid-column:auto}}[data-theme="ultra-retro"] body{background:#087f80!important}[data-theme="ultra-retro"] .card{border-radius:0;background:#ddd;color:#000;box-shadow:inset 2px 2px #fff,inset -2px -2px #777,5px 5px #111}[data-theme="ultra-retro"] input,[data-theme="ultra-retro"] select,[data-theme="ultra-retro"] textarea{border-radius:0;background:#fff;color:#000}[data-theme="ultra-retro"] label,[data-theme="ultra-retro"] p{color:#111!important}
</style></head><body><main class="shell"><button class="back" onclick="parent!==window?parent.closePocket():history.back()">← Pocket Archive</button><h1>Import your game.</h1><span class="private">● LOCAL ONLY · EXCLUDED FROM GIT</span><p>Select a backup you made from a game you own. Add your own cover or real gameplay GIFs, describe it once, and Pocket Archive builds the card automatically.</p><form id="game-import" class="importer"><section class="card"><h2>Game details</h2><div class="fields"><label>Display title<input name="title" required></label><label>System<select name="system"><option>Auto detect</option><option>GBA</option><option>Game Boy</option><option>GBC</option><option>NES</option><option>SNES</option><option>Genesis</option><option>N64</option><option>PlayStation</option></select></label><label>Genre<input name="genre" placeholder="Racing, RPG…"></label><label>Year<input name="year" inputmode="numeric" maxlength="4"></label><label>Players<select name="players"><option>Single player</option><option>1–2 players</option><option>1–4 players</option></select></label><label>Xbox notes<input name="controls" placeholder="A jump · X attack"></label></div><label>Description<textarea name="description" required></textarea></label></section><section class="card"><h2>Private files</h2><div class="files"><label><b>Owned game file · required</b><input id="rom" type="file" required accept=".gba,.gb,.gbc,.nes,.sfc,.smc,.md,.gen,.z64,.n64,.v64,.cue,.chd,.iso"></label><label><b>Cover/screenshot · optional</b><input id="cover" type="file" accept="image/*"></label><label><b>Gameplay GIF 1 · optional</b><input id="preview1" type="file" accept="image/gif,image/png,image/jpeg,image/webp"></label><label><b>Gameplay GIF 2 · optional</b><input id="preview2" type="file" accept="image/gif,image/png,image/jpeg,image/webp"></label></div><aside><b>Duplicate-safe</b><p>Existing files are never overwritten.</p></aside></section><section class="card wide"><button class="submit">Import into Pocket Archive</button><p id="status" class="status" role="status"></p></section></form></main><script>
const form=document.querySelector('#game-import'),status=document.querySelector('#status'),slug=value=>value.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||'game';async function upload(file,kind,id){if(!file)return;status.textContent='Adding '+file.name+'…';const response=await fetch('/api/game-import/file?kind='+kind,{method:'POST',headers:{'X-File-Name':encodeURIComponent(file.name),'X-Game-Slug':id},body:file}),result=await response.json();if(!response.ok)throw Error(result.error||'Could not import '+file.name)}form.onsubmit=async event=>{event.preventDefault();const button=form.querySelector('.submit'),data=Object.fromEntries(new FormData(form)),rom=document.querySelector('#rom').files[0],id=slug(data.title);button.disabled=true;try{await upload(rom,'rom',id);await upload(document.querySelector('#cover').files[0],'cover',id);await upload(document.querySelector('#preview1').files[0],'preview1',id);await upload(document.querySelector('#preview2').files[0],'preview2',id);status.textContent='Saving game details…';const response=await fetch('/api/game-import/metadata',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,slug:id,rom_name:rom.name})}),result=await response.json();if(!response.ok)throw Error(result.error||'Could not save details');status.textContent='Imported. Reopen Pocket Archive to play it.';button.textContent='Imported ✓'}catch(error){status.textContent=error.message;button.disabled=false}};
</script></body></html>
