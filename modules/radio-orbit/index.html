<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b0f">
  <title>Radio Orbit</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="embedded.css">
  <link rel="stylesheet" href="colorful.css">
  <link rel="stylesheet" href="club.css">
  <link rel="stylesheet" href="classic-gray.css">
  <link rel="stylesheet" href="orbit-controls.css">
  <link rel="stylesheet" href="retro-visual-fix.css?v=80">
  <link rel="stylesheet" href="orbit-contrast.css?v=99">
  <link rel="stylesheet" href="orbit-contrast-plus.css?v=1">
  <link rel="stylesheet" href="orbit-channel-rail.css?v=1">
</head>
<body>
  <canvas id="visualizer" aria-hidden="true"></canvas>
  <div id="beat-reactor" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <header>
    <button class="icon-btn orbit-home" onclick="parent.postMessage({type:'orbit-home'},'*')" aria-label="Back to Homebase">←</button>
    <a class="brand" href="#"><span class="brand-mark">NO</span><span>HOMEBASE / ORBIT</span></a>
    <button id="fullscreen" class="icon-btn" title="Fullscreen" aria-label="Fullscreen">⛶</button>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">TRANSMISSION / <span id="location">WORLDWIDE</span></div>
      <h1 id="stationName"><span class="station-title">Find your</span><br><em>frequency.</em></h1>
      <img id="localCover" class="local-cover" alt="Local playlist cover" hidden>
      <p id="stationMeta">Search thousands of independent stations broadcasting from every corner of the planet.</p>
      <div class="tuner">
        <button id="play" class="play" aria-label="Play station">▶</button>
        <div class="track">
          <span>NOW RECEIVING</span>
          <strong id="nowPlaying">NO SIGNAL SELECTED</strong>
        </div>
        <button id="favorite" class="heart" aria-label="Favorite station">♡</button>
      </div>
      <div class="volume-row">
        <span>VOL</span><input id="volume" type="range" min="0" max="1" value="0.75" step="0.01"><span id="volumeValue">75</span>
        <button id="previousTrack" class="local-audio">◀</button><button id="nextTrack" class="local-audio">▶</button><button id="openAudio" class="local-audio">ADD PLAYLIST</button><button id="openCover" class="local-audio">ALBUM PHOTOS</button><input id="audioFile" type="file" accept="audio/mpeg,audio/mp3,audio/wav,audio/ogg,audio/flac" multiple hidden><input id="coverFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
      </div>
      <div id="localAlbums" class="local-albums" hidden aria-label="Local playlist browser"></div>
    </section>

    <aside class="browser">
      <div class="browser-head">
        <div><span class="number">01</span><h2>Browse signals</h2></div>
        <button id="favoritesOnly" class="filter">☆ SAVED</button>
      </div>
      <form id="searchForm" class="search">
        <span>⌕</span><input id="search" autocomplete="off" placeholder="Search name, genre, country…" aria-label="Search stations"><button>SCAN</button>
      </form>
      <div class="chips" id="chips">
        <button data-q="" class="active">Popular</button><button data-q="jazz">Jazz</button><button data-q="lofi">Lo-fi</button><button data-q="rock">Rock</button><button data-q="classical">Classical</button>
      </div>
      <div class="quick-plays" id="quick-plays" aria-label="Quick play stations"><button data-q="vaporwave">Vaporwave</button><button data-q="Jimi Hendrix">Jimi Hendrix</button><button data-q="80s">80s radio</button><button data-q="90s hip hop">90s</button><button data-q="synthwave">Synthwave</button><button data-q="video game music">Game music</button></div>
      <div id="status" class="status">SCANNING THE AIRWAVES…</div>
      <div id="stations" class="stations"></div>
    </aside>
  </main>

  <footer>
    <div class="modes"><span>VISUAL MODE · SWIPE BACKGROUND</span><button data-mode="wave">WAVE</button><button data-mode="club">CLUB</button><button data-mode="orbit">ORBIT</button><button data-mode="bars">SPECTRUM</button><button data-mode="tunnel">TUNNEL</button><button data-mode="radar">RADAR</button><button data-mode="nebula">NEBULA</button><button data-mode="pixel">PIXEL</button><button data-mode="terminal">TERMINAL</button></div>
  </footer>
  <audio id="audio"></audio>
  <script src="app.js?v=64"></script>
</body>
</html>
