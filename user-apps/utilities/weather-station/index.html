<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Station · Homebase</title><link rel="stylesheet" href="/assets/styles/shared/ultra-retro.css"><script src="/assets/scripts/shared/theme-sync.js"></script><style>:root{--ink:#eef4ee;--panel:#101a18;--line:#6c8d7e;--accent:#f0ca5a}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 88% 8%,#e8b94b22,transparent 27%),#08100e;font:15px system-ui,sans-serif}.shell{width:min(900px,100%);margin:auto;padding:28px clamp(16px,5vw,60px) 74px}.back,button,input{font:inherit}button,.back{cursor:pointer}.back,form button{min-height:46px;border:1px solid #87b29d;border-radius:8px;background:#173229;color:#fff;padding:0 15px}.mast{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:38px 0 20px}.mast small{color:#efce66;letter-spacing:.16em}.mast h1{margin:4px 0 0;font-size:clamp(36px,8vw,72px);letter-spacing:-.07em}form{display:grid;grid-template-columns:1fr auto;gap:8px}.search{min-height:54px;border:1px solid #67917d;border-radius:9px;background:#07100d;color:#fff;padding:0 14px}.status{min-height:30px;color:#b9d9c8}.now{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:25px;border:1px solid #769481;border-radius:15px;background:linear-gradient(145deg,#173129,#0b1714);box-shadow:0 18px 44px #0007}.glyph{font-size:68px;color:#f2cd5c;text-shadow:0 0 24px #f2cd5c55}.now h2{margin:0;font-size:32px}.now p{margin:4px 0;color:#b7c9c0}.temp{font-size:50px;font-weight:750}.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}.day{padding:13px 10px;border:1px solid #567465;border-radius:11px;background:#10221d;text-align:center}.day b,.day span{display:block}.day span{margin:9px 0;font-size:25px;color:#f0ca5a}.day small{color:#a8c1b5}@media(max-width:620px){.mast{align-items:start;flex-direction:column}.now{grid-template-columns:auto 1fr}.temp{grid-column:1/-1}.forecast{grid-template-columns:repeat(2,1fr)} }html[data-theme="ultra-retro"] body{background:#008080!important;color:#000!important}html[data-theme="ultra-retro"] .shell{padding-top:50px!important}html[data-theme="ultra-retro"] h1{color:#000!important}html[data-theme="ultra-retro"] .now,html[data-theme="ultra-retro"] .day{border:2px solid #000;border-radius:0;background:#d4d4d4;box-shadow:inset 2px 2px #fff,inset -2px -2px #666,4px 4px #111}html[data-theme="ultra-retro"] .now p,html[data-theme="ultra-retro"] .day small,html[data-theme="ultra-retro"] .status{color:#111!important}html[data-theme="ultra-retro"] .glyph,html[data-theme="ultra-retro"] .day span{color:#000080;text-shadow:none}html[data-theme="ultra-retro"] form button,html[data-theme="ultra-retro"] .back{border:2px outset #eee;border-radius:0;background:#d4d4d4;color:#000;box-shadow:inset 1px 1px #fff,inset -1px -1px #666}html[data-theme="ultra-retro"] .search{border:2px inset #eee;border-radius:0;background:#fff;color:#000}</style></head><body><main class="shell"><button class="back" onclick="parent!==window&&parent.closePocket?parent.closePocket():history.back()">← Homebase</button><header class="mast"><div><small>OPEN-METEO · FREE FORECAST SIGNAL</small><h1>Weather Station.</h1></div><span>KEYLESS API</span></header><form id="search"><input class="search" id="place" value="Indianapolis" aria-label="Search city or town" placeholder="Search a city"><button>Search</button></form><p id="status" class="status">Searching the atmosphere…</p><section id="now" class="now" hidden><div class="glyph" id="glyph">☀</div><div><h2 id="name">—</h2><p id="summary">—</p><p id="details">—</p></div><b id="temp" class="temp">—</b></section><section id="forecast" class="forecast"></section></main><script>const $=s=>document.querySelector(s),code={0:['☀','Clear'],1:['◌','Mostly clear'],2:['☁','Partly cloudy'],3:['☁','Overcast'],45:['≋','Fog'],48:['≋','Rime fog'],51:['☂','Drizzle'],61:['☂','Rain'],71:['❄','Snow'],80:['☂','Showers'],95:['ϟ','Thunderstorms']},label=n=>code[n]||['◌','Changing skies'];async function load(place){$('#status').textContent='Looking up '+place+'…';$('#now').hidden=true;$('#forecast').innerHTML='';try{const geo=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(place)+'&count=1&language=en&format=json').then(r=>r.json()),hit=geo.results?.[0];if(!hit)throw Error('No matching city. Try a nearby town or country.');const data=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+hit.latitude+'&longitude='+hit.longitude+'&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto').then(r=>r.json()),current=data.current,look=label(current.weather_code);$('#name').textContent=hit.name+(hit.admin1?', '+hit.admin1:'');$('#glyph').textContent=look[0];$('#summary').textContent=look[1]+' · feels like '+Math.round(current.apparent_temperature)+'°';$('#details').textContent='Wind '+Math.round(current.wind_speed_10m)+' mph · updated locally';$('#temp').textContent=Math.round(current.temperature_2m)+'°';$('#now').hidden=false;$('#forecast').innerHTML=data.daily.time.slice(0,5).map((day,i)=>{const l=label(data.daily.weather_code[i]);return '<article class="day"><b>'+new Date(day+'T12:00').toLocaleDateString([],{weekday:'short'})+'</b><span>'+l[0]+'</span><small>'+Math.round(data.daily.temperature_2m_max[i])+'° / '+Math.round(data.daily.temperature_2m_min[i])+'°</small></article>'}).join('');$('#status').textContent='Live forecast from Open-Meteo · no API key used.'}catch(error){$('#status').textContent=error.message}}$('#search').onsubmit=e=>{e.preventDefault();load($('#place').value.trim())};load($('#place').value);</script></body></html>
