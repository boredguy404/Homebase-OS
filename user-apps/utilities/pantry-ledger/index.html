<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantry Ledger</title><script src="/assets/scripts/shared/theme-sync.js"></script><link rel="stylesheet" href="app.css"></head>
<body><header><a href="/">← NovaShell</a><div><small>PRIVATE LOCAL INVENTORY</small><h1>Pantry Ledger</h1></div><button id="add">+ Add item</button></header>
<main><section class="stats"><article><small>ITEM TYPES</small><b id="types">0</b></article><article><small>LOW STOCK</small><b id="low">0</b></article><article><small>EXPIRING SOON</small><b id="soon">0</b></article></section>
<section class="tools"><input id="search" type="search" placeholder="Search your inventory…"><select id="category"><option value="">All categories</option></select><select id="sort"><option value="newest">Newest added</option><option value="expiry">Expiry soonest</option><option value="low">Lowest stock</option><option value="name">Name A–Z</option></select></section>
<section id="inventory" class="inventory"></section></main>
<dialog id="editor"><form method="dialog"><div class="title"><b id="editor-title">ADD ITEM</b><button value="cancel" aria-label="Close">×</button></div><div class="fields"><label>Name<input id="name" required maxlength="80"></label><label>Category<input id="item-category" list="categories" maxlength="40" placeholder="Pantry, freezer, supplies…"></label><datalist id="categories"></datalist><label>Quantity<input id="quantity" type="number" min="0" max="999" value="1"></label><label>Low-stock warning<input id="threshold" type="number" min="0" max="999" value="1"></label><label>Best before<input id="expiry" type="date"></label></div><menu><button value="cancel">Cancel</button><button id="save" value="default">Save item</button></menu></form></dialog>
<dialog id="remove"><form method="dialog"><div class="title"><b>REMOVE ITEM?</b><button value="cancel" aria-label="Close">×</button></div><p>This only removes the local entry. Tap remove again to confirm.</p><menu><button value="cancel">Keep it</button><button id="confirm-remove" value="default">Remove</button></menu></form></dialog>
<script src="app.js"></script></body></html>
