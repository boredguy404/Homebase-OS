<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maker Desk</title><script src="/assets/scripts/shared/theme-sync.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101821;color:#eef7fb;font:14px system-ui}.shell{width:min(980px,100%);margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.top small{color:#9bd9ed;font:700 10px ui-monospace,monospace;letter-spacing:.14em}.top h1{margin:5px 0;font-size:clamp(28px,5vw,48px);letter-spacing:-.06em}.top p{margin:0;color:#b7cad2;max-width:540px;line-height:1.55}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tools button,.palette button{min-height:42px;border:1px solid #ffffff35;border-radius:10px;background:#ffffff12;color:inherit;padding:0 12px;font:inherit;cursor:pointer}.tools .primary{background:#bde7ef;color:#102028;border-color:#bde7ef}.palette{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.palette button{display:flex;gap:7px;align-items:center}.palette i{width:16px;height:16px;border:1px solid #0007;border-radius:3px;background:var(--tile)}.palette button.active{outline:3px solid #82e4f8;outline-offset:2px}.board{display:grid;grid-template-columns:repeat(16,minmax(18px,1fr));gap:2px;padding:10px;border:1px solid #ffffff35;border-radius:14px;background:#071017;touch-action:none}.cell{aspect-ratio:1;border:0;border-radius:2px;background:var(--tile);cursor:crosshair}.cell:focus-visible{outline:2px solid #fff;outline-offset:1px}.status{min-height:22px;color:#a9eac9;margin:12px 0 0}.tip{margin:18px 0 0;color:#a9c1cb;line-height:1.5}.tip b{color:#e9f8fb}html[data-theme="ultra-retro"] body{background:#aaa;color:#111;font-family:"MS Sans Serif",Tahoma,sans-serif}html[data-theme="ultra-retro"] .top small,html[data-theme="ultra-retro"] .top p,html[data-theme="ultra-retro"] .tip{color:#111}html[data-theme="ultra-retro"] .tools button,html[data-theme="ultra-retro"] .palette button,html[data-theme="ultra-retro"] .board{border:2px solid #111;border-radius:0;background:#eee;box-shadow:inset 1px 1px #fff,inset -1px -1px #777}html[data-theme="ultra-retro"] .tools .primary{background:#000080;color:#fff;border-color:#000080}@media(max-width:600px){.shell{padding:15px}.board{padding:6px;gap:1px}.tools button{flex:1}.cell{min-width:16px}}
</style></head><body><main class="shell"><header class="top"><div><small>LOCAL PROJECT SKETCHPAD</small><h1>Maker Desk.</h1><p>Draw a tiny tile map for a future game project. This is intentionally plain, portable, and offline.</p></div></header><div class="tools"><button class="primary" id="save">Save locally</button><button id="export">Export JSON</button><button id="import">Import JSON</button><button id="clear">Clear board</button><input id="file" type="file" accept="application/json,.json" hidden></div><div class="palette" id="palette"></div><section class="board" id="board" aria-label="16 by 12 tile map"></section><p class="status" id="status"></p><p class="tip"><b>Touch:</b> choose a tile, then tap or drag. The exported JSON is an ordinary map array—ready to hand to a game engine later without locking you into this app.</p></main><script>(()=>{const W=16,H=12,key='novashell-maker-desk-v1',tiles={floor:'#739455',wall:'#46535a',water:'#4d91bb',sand:'#cbb673',spawn:'#f28b54',gem:'#be79cf'},$=s=>document.querySelector(s),board=$('#board'),palette=$('#palette'),status=$('#status');let selected='floor',paint=false,map=[];try{map=JSON.parse(localStorage.getItem(key)||'[]')}catch{}if(!Array.isArray(map)||map.length!==W*H)map=Array(W*H).fill('floor');function say(t){status.textContent=t}function render(){board.replaceChildren();map.forEach((tile,index)=>{const b=document.createElement('button');b.className='cell';b.style.setProperty('--tile',tiles[tile]||tiles.floor);b.dataset.index=index;b.setAttribute('aria-label',tile+' tile');b.onclick=()=>set(index);b.onpointerenter=e=>{if(paint)set(index)};board.append(b)})}function set(i){map[i]=selected;render()}Object.entries(tiles).forEach(([id,color])=>{const b=document.createElement('button');b.innerHTML='<i></i><span></span>';b.querySelector('i').style.setProperty('--tile',color);b.querySelector('span').textContent=id;b.classList.toggle('active',id===selected);b.onclick=()=>{selected=id;[...palette.children].forEach(x=>x.classList.toggle('active',x===b))};palette.append(b)});board.onpointerdown=e=>{paint=true;board.setPointerCapture?.(e.pointerId)};board.onpointerup=board.onpointercancel=()=>paint=false;$('#save').onclick=()=>{localStorage.setItem(key,JSON.stringify(map));say('Saved locally in this browser.')};$('#clear').onclick=()=>{map=Array(W*H).fill('floor');render();say('Blank board ready.')};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,width:W,height:H,tiles:map},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='maker-desk-map.json';a.click();URL.revokeObjectURL(a.href);say('Exported JSON map.')};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async()=>{try{const data=JSON.parse(await $('#file').files[0].text());if(!Array.isArray(data.tiles)||data.tiles.length!==W*H)throw Error();map=data.tiles.map(x=>tiles[x]?x:'floor');render();say('Imported map.')}catch{say('That is not a compatible 16 × 12 Maker Desk map.')}$('#file').value=''};render()})();</script></body></html>
