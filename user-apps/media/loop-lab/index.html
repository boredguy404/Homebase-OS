<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loop Lab</title><script src="/assets/scripts/shared/theme-sync.js"></script><link rel="stylesheet" href="app.css"></head><body><header><a href="/">← NovaShell</a><div><small>LOCAL AUDIO WORKBENCH</small><h1>Loop Lab</h1></div><label class="load">Load audio<input id="file" type="file" accept="audio/*"></label></header><main><section class="deck"><div class="track"><span id="name">No track loaded</span><span id="clock">00:00 / 00:00</span></div><canvas id="wave" width="1200" height="240" aria-label="Audio waveform"></canvas><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><div class="transport"><button id="back">−5s</button><button id="play" disabled>Play</button><button id="forward">+5s</button><button id="a">Set A</button><button id="b">Set B</button><button id="loop" aria-pressed="true">Loop on</button></div></section><section class="controls"><label>LOOP START <input id="start" type="number" min="0" step="0.01" value="0"><span>seconds</span></label><label>LOOP END <input id="end" type="number" min="0" step="0.01" value="0"><span>seconds</span></label><label>SPEED <input id="speed" type="range" min="0.5" max="1.5" step="0.05" value="1"><output id="speed-label">1.00×</output></label></section><p class="privacy">Your track stays in this tab. NovaShell does not upload it or add it to Git.</p></main><audio id="audio" preload="metadata"></audio><script src="app.js"></script></body></html>
