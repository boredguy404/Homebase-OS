<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pose Lab</title><script src="/assets/scripts/shared/theme-sync.js"></script><link rel="stylesheet" href="app.css"></head><body><header><a href="/">← NovaShell</a><div><small>LOCAL RIG WORKBENCH</small><h1>Pose Lab</h1></div><button id="export">Export JSON</button></header><main><section class="stage"><canvas id="rig" width="720" height="720" aria-label="Draggable character rig"></canvas><p>Drag the bright joint nodes. Touch, mouse, and pen all use the same controls.</p></section><aside><section><h2>Pose controls</h2><label>POSE NAME<input id="name" maxlength="50" placeholder="Example: Wave"></label><div class="row"><button id="save">Save pose</button><button id="reset">Reset rig</button></div></section><section><div class="section-title"><h2>Saved poses</h2><span id="count">0</span></div><div id="poses"></div></section><section><h2>Transition preview</h2><p>Select two saved poses, then preview the movement between them.</p><div class="row"><button id="preview" disabled>Preview</button><button id="stop" disabled>Stop</button></div></section></aside></main><dialog id="remove"><div><b>DELETE POSE?</b><button aria-label="Close">×</button></div><p>Tap delete again to remove this local pose.</p><menu><button id="keep">Keep it</button><button id="confirm">Delete</button></menu></dialog><script src="app.js"></script></body></html>
