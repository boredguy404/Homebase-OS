<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Deck</title><script src="/assets/scripts/shared/theme-sync.js"></script><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="rounds.css"></head>
<body><header><a href="/">← NovaShell</a><div><small>LOCAL FOCUS ENGINE</small><h1>Focus Deck</h1></div></header>
<main><nav class="mode-tabs" aria-label="Focus Deck mode"><button id="focus-mode" class="active">Focus session</button><button id="round-mode">Training rounds</button></nav>
<div id="focus-panel"><section class="timer"><div class="dial"><strong id="time">25:00</strong><span id="state">READY</span></div><input id="label" maxlength="60" placeholder="What are you working on?"><div class="presets"><button data-min="15">15 min</button><button data-min="25" class="active">25 min</button><button data-min="45">45 min</button><button data-min="60">60 min</button></div><div class="actions"><button id="start">Start</button><button id="pause" disabled>Pause</button><button id="finish" disabled>Finish</button></div></section><section class="summary"><article><small>TODAY</small><b id="today">0 min</b></article><article><small>SESSIONS</small><b id="count">0</b></article><article><small>THIS WEEK</small><b id="week">0 min</b></article></section><section class="log"><h2>Session log</h2><div id="entries"></div></section></div>
<div id="round-panel" hidden><section class="round-console"><div class="round-display"><small id="round-phase">READY</small><strong id="round-time">03:00</strong><span id="round-count">ROUND 1 / 3</span></div><div class="round-config"><label>WORK MINUTES<input id="work-min" type="number" min="1" max="60" value="3"></label><label>REST SECONDS<input id="rest-sec" type="number" min="5" max="600" value="60"></label><label>ROUNDS<input id="rounds" type="number" min="1" max="99" value="3"></label><label class="cue"><input id="cue" type="checkbox" checked> Audible phase cue</label></div><div class="round-actions"><button id="round-start">Start rounds</button><button id="round-pause" disabled>Pause</button><button id="round-reset" disabled>Reset</button></div></section><p class="round-note">Settings and an active round recover after reload. Audio cues begin only after you press Start.</p></div></main>
<script src="app.js"></script><script src="rounds.js"></script></body></html>
