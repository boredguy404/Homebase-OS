<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Deck</title><script src="/assets/scripts/shared/theme-sync.js"></script><link rel="stylesheet" href="app.css"></head><body><header><a href="/">← NovaShell</a><div><small>LOCAL FOCUS ENGINE</small><h1>Focus Deck</h1></div></header><main><section class="timer"><div class="dial"><strong id="time">25:00</strong><span id="state">READY</span></div><input id="label" maxlength="60" placeholder="What are you working on?"><div class="presets"><button data-min="15">15 min</button><button data-min="25" class="active">25 min</button><button data-min="45">45 min</button><button data-min="60">60 min</button></div><div class="actions"><button id="start">Start</button><button id="pause" disabled>Pause</button><button id="finish" disabled>Finish</button></div></section><section class="summary"><article><small>TODAY</small><b id="today">0 min</b></article><article><small>SESSIONS</small><b id="count">0</b></article><article><small>THIS WEEK</small><b id="week">0 min</b></article></section><section class="log"><h2>Session log</h2><div id="entries"></div></section></main><script src="app.js"></script></body></html>
