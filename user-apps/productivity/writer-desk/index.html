<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Writer Desk</title><script src="/assets/scripts/shared/theme-sync.js"></script><link rel="stylesheet" href="app.css"></head><body><header><a href="/">← NovaShell</a><div><small>PRIVATE LOCAL DRAFTS</small><h1>Writer Desk</h1></div><button id="focus">Focus</button></header><main><aside><div class="aside-title"><b>DOCUMENTS</b><button id="new">+</button></div><nav id="docs"></nav><div class="aside-actions"><label>Import<input id="import" type="file" accept=".txt,.md,.fountain,text/plain,text/markdown"></label><button id="delete">Delete</button></div></aside><section class="workspace"><input id="title" maxlength="90" aria-label="Document title" placeholder="Untitled"><div class="toolbar"><select id="kind"><option value="text">Plain text</option><option value="fountain">Screenplay / Fountain</option><option value="markdown">Markdown</option></select><span id="status">Saved locally</span><button id="export">Export</button></div><textarea id="editor" spellcheck="true" placeholder="Start writing…"></textarea><footer><span id="words">0 words</span><span id="chars">0 characters</span></footer></section></main><dialog id="remove"><div class="window-title"><b>DELETE DRAFT?</b><button aria-label="Close">×</button></div><p>This removes the selected local draft from this browser. Tap delete again to confirm.</p><menu><button id="keep">Keep it</button><button id="confirm">Delete draft</button></menu></dialog><script src="app.js"></script></body></html>
