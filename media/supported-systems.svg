<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">NovaShell supported game systems</title><desc id="desc">Pixel-styled tiles for Game Boy, Game Boy Color, Game Boy Advance, NES, Super Nintendo, Genesis, Nintendo 64, and PlayStation.</desc>
